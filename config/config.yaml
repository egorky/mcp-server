# MCP Server Configuration File
server:
  host: "0.0.0.0"
  port: 5001
  debug: false
  enable_web_ui: true
  # IMPORTANT: Change this in your production environment!
  secret_key: "a_very_secret_and_complex_key_for_flask_sessions"

web_auth:
  username: "config_user"
  # Use mcp_server/utils/hash_password.py to generate a new hash for your password.
  # To generate: from werkzeug.security import generate_password_hash; print(generate_password_hash('your_password_here'))
  password_hash: "pbkdf2:sha256:260000\$exampleSalt\$9a3examplehash..." # Replace with a real hash
  # For testing, you can temporarily use .env for MCP_WEB_PASSWORD="your_password"

logging:
  level: "INFO"
  file: "mcp_server.log"
  # Format for log messages
  format: "%(asctime)s - %(name)s - %(levelname)s - %(module)s:%(lineno)d - %(message)s"
  # Log rotation settings
  max_bytes: 10485760 # 10MB
  backup_count: 5

tools:
  script_runner:
    scripts_base_path: "/app/mcp_scripts" # Adjusted path
    default_timeout: 60

  api_caller:
    default_timeout: 30
