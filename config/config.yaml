# MCP Server Configuration File
server:
  host: "0.0.0.0"
  port: 5001
  debug: false
  enable_web_ui: true
  # IMPORTANT: Change this in your production environment!
  secret_key: "a_very_secret_and_complex_key_for_flask_sessions"

web_auth:
  username: "config_user"
  # Use mcp_server/utils/hash_password.py to generate a new hash for your password.
  # To generate: from werkzeug.security import generate_password_hash; print(generate_password_hash('your_password_here'))
  password_hash: "pbkdf2:sha256:260000\$exampleSalt\$9a3examplehash..." # Replace with a real hash
  # For testing, you can temporarily use .env for MCP_WEB_PASSWORD="your_password"

api_auth:
  # Static token for API authentication. Generate a secure random string for this.
  # Example: openssl rand -hex 32
  static_token: "your_very_secret_api_token_here" # CHANGE THIS!
  # Header name to look for the API token. Default is X-API-KEY.
  # Can also use "Authorization" and then the token should be "Bearer <your_token>"
  header_name: "X-API-KEY"

logging:
  level: "INFO"
  file: "mcp_server.log"
  # Format for log messages
  format: "%(asctime)s - %(name)s - %(levelname)s - %(module)s:%(lineno)d - %(message)s"
  # Log rotation settings
  max_bytes: 10485760 # 10MB
  backup_count: 5

tools:
  script_runner:
    scripts_base_path: "/app/mcp_scripts" # Adjusted path
    default_timeout: 60 # Default execution timeout for scripts in seconds. Can be overridden per execution.

  api_caller:
    default_connect_timeout: 10 # Default connection timeout in seconds.
    default_read_timeout: 30    # Default read timeout in seconds.
    # These can be overridden by per-execution 'connect_timeout' and 'read_timeout' parameters.
    # An overall 'timeout' parameter can also be provided per-execution.
    # If an old 'default_timeout' (singular) is present here and these specific ones are not,
    # it might be used as a fallback by the tool, but migrating to specific timeouts is recommended.

[end of config/config.yaml]
